<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OhMyFood - Réservez le menu qui vous convient</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header class="header">
        <img src="assets/img/images/logo/ohmyfood@2x.svg" alt="ohmyfood" class="header__logo">
    </header>

    <div class="location">
        <i class="fa-solid fa-location-dot"></i>
        <span>Paris, Belleville</span>
    </div>

    <section class="hero">
        <h1>Réservez le menu qui vous convient</h1>
            <p>Découvrez des restaurants d'exception, sélectionnés par nos soins.</p>
            <button class="btn-primary">Explorer nos restaurants</button>
    </section>

    <section class="how-it-works">
        <h2>Fonctionnement</h2>
            <ul class="how-it-works__list">
                <li class="how-it-works__item">
                    <span class="how-it-works__number">1</span>
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <p>Choisissez un restaurant</p>
                </li>
                <li class="how-it-works__item">
                    <span class="how-it-works__number">2</span>
                    <i class="fa-solid fa-list-ul"></i>
                    <p>Composez votre menu</p>
                </li>
                <li class="how-it-works__item">
                    <span class="how-it-works__number">3</span>
                    <i class="fa-solid fa-store"></i>
                    <p>Dégustez au restaurant</p>
                </li>
            </ul>
    </section>








</body>
</html>
